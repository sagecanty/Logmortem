name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --require-hashes -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --cov=src --cov=eval --cov-report=term-missing

      - name: Eval plumbing gate (no LLM, free)
        # Runs every fixture through the scoring pipeline without API calls.
        # Catches scorer/plumbing regressions on every PR; the full LLM eval
        # is the manual eval-llm workflow (costs a few cents, needs a key).
        run: python3 -m eval.harness --no-llm --gate
