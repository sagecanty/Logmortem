name: Auto RCA on Deploy Failure

on:
  workflow_run:
    workflows: ["*"]  # triggers on any workflow failure
    types:
      - completed

jobs:
  generate-rca:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      id-token: write  # OIDC: lets this job assume an AWS role, so no stored AWS keys (THREAT_MODEL T8)

    # SECURITY (THREAT_MODEL T7): every value that comes from the triggering
    # event is passed through `env:` and read as a quoted shell variable.
    # Never write `${{ github.event.* }}` inside a `run:` block — Actions
    # substitutes it into the script text *before* the shell runs, so a
    # crafted value becomes code. tests/test_workflow_security.py enforces this.
    env:
      RUN_NAME: ${{ github.event.workflow_run.name }}
      RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
      RUN_REPO: ${{ github.event.workflow_run.repository.full_name }}

    steps:
      - name: Checkout logmortem
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false  # don't leave the token on disk for later steps

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Configure AWS credentials (OIDC, short-lived)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
          role-session-name: logmortem-auto-rca

      - name: Set incident window
        id: window
        run: |
          # Use workflow run timestamps as the incident window
          START=$(date -u -d "$RUN_STARTED_AT" +"%Y-%m-%dT%H:%M:%S")
          END=$(date -u +"%Y-%m-%dT%H:%M:%S")
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "end=$END" >> "$GITHUB_OUTPUT"

      - name: Generate RCA
        id: rca
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_GROUP: ${{ secrets.LOG_GROUP || '/aws/ecs/app' }}
          WINDOW_START: ${{ steps.window.outputs.start }}
          WINDOW_END: ${{ steps.window.outputs.end }}
        run: |
          python -m src.main \
            --log-group "$LOG_GROUP" \
            --start-time "$WINDOW_START" \
            --end-time "$WINDOW_END" \
            --alert "Deploy failure: $RUN_NAME (#$RUN_NUMBER)" \
            --repo "$RUN_REPO" \
            --output rca_output.md

      - name: Post RCA to job summary
        if: always()
        run: |
          {
            echo "## 🔍 logmortem — Auto-generated RCA"
            echo ""
            printf '**Triggered by:** `%s` run #%s\n' "$RUN_NAME" "$RUN_NUMBER"
            printf '**Failed at:** %s\n' "$RUN_STARTED_AT"
            echo ""
            if [ -f rca_output.md ]; then
              cat rca_output.md
            else
              echo "_No RCA was generated — see the Generate RCA step log._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload RCA as artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: rca-${{ github.event.workflow_run.run_number }}
          path: rca_output.md
          retention-days: 30
